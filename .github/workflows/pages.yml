# Builds the game and publishes it to GitHub Pages.
#
# Manual only: nothing deploys until the owner runs this workflow. Before the
# first run, enable Pages for the repository with "GitHub Actions" as the
# source (Settings → Pages). The build uses relative asset URLs, so it works
# at https://<user>.github.io/Ocarina/ without configuration.
name: Deploy web build to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run assets:check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
